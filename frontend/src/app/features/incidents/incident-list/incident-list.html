<div class="page">

  <div class="header">

    <div>
      <h1>AeroTrack Incidents</h1>
      <p>Manage and monitor aviation incidents</p>
    </div>

    <div class="header-actions">

      <button
        *ngIf="role === 'ADMIN'"
        mat-raised-button
        color="primary"
        (click)="openCreate()"
      >
        Create Incident
      </button>

      <button
        mat-raised-button
        color="warn"
        (click)="logout()"
      >
        Logout
      </button>

    </div>

  </div>

  <mat-card class="filters-card">

    <div class="filters">

      <input
        [(ngModel)]="keyword"
        placeholder="Search..."
      />

      <select [(ngModel)]="severity">

        <option value="">All Severities</option>
        <option value="LOW">LOW</option>
        <option value="MEDIUM">MEDIUM</option>
        <option value="HIGH">HIGH</option>

      </select>

      <button
        mat-raised-button
        color="primary"
        (click)="applyFilters()"
      >
        Filter
      </button>

      <button
        mat-button
        (click)="resetFilters()"
      >
        Reset
      </button>

    </div>

  </mat-card>

  <mat-card class="table-card">

    <table
      mat-table
      [dataSource]="incidents"
      class="full-width"
    >

      <!-- ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>

        <td mat-cell *matCellDef="let incident">
          {{ incident.id }}
        </td>
      </ng-container>

      <!-- TITLE -->
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>

        <td mat-cell *matCellDef="let incident">
          {{ incident.title }}
        </td>
      </ng-container>

      <!-- DESCRIPTION -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>

        <td mat-cell *matCellDef="let incident">
          {{ incident.description }}
        </td>
      </ng-container>

      <!-- SEVERITY -->
      <ng-container matColumnDef="severity">

        <th mat-header-cell *matHeaderCellDef>Severity</th>

        <td mat-cell *matCellDef="let incident">

          <span
            class="badge"
            [ngClass]="{
              'high': incident.severity === 'HIGH',
              'medium': incident.severity === 'MEDIUM',
              'low': incident.severity === 'LOW'
            }"
          >
            {{ incident.severity }}
          </span>

        </td>

      </ng-container>

      <!-- STATUS -->
      <ng-container matColumnDef="status">

        <th mat-header-cell *matHeaderCellDef>Status</th>

        <td mat-cell *matCellDef="let incident">

          <span
            class="badge"
            [ngClass]="{
              'open': incident.status === 'OPEN',
              'progress': incident.status === 'IN_PROGRESS',
              'closed': incident.status === 'CLOSED'
            }"
          >
            {{ incident.status }}
          </span>

        </td>

      </ng-container>

      <!-- ACTIONS -->
      <ng-container
        *ngIf="role === 'ADMIN'"
        matColumnDef="actions"
      >

        <th mat-header-cell *matHeaderCellDef>Actions</th>

        <td mat-cell *matCellDef="let incident">

          <div class="actions-buttons">

            <button
              mat-button
              color="primary"
              (click)="openEdit(incident.id)"
            >
              Edit
            </button>

            <button
              mat-button
              color="warn"
              (click)="delete(incident.id)"
            >
              Delete
            </button>

          </div>

        </td>

      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
      ></tr>

      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns;"
      ></tr>

    </table>

    <mat-paginator
      [length]="totalElements"
      [pageSize]="size"
      [pageSizeOptions]="[5, 10, 20]"
      (page)="onPageChange($event)"
    >
    </mat-paginator>

  </mat-card>

</div>
